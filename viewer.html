<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viewer</title>
  <link rel="stylesheet" href="style.css" />
  <script src="env.js"></script>
</head>
<body class="viewer-body">
  <div class="viewer-layout">
    <div class="toolbar" id="toolbar">
      <a href="index.html" class="toolbar-back">← All prototypes</a>
      <span class="toolbar-title" id="toolbar-title">Loading…</span>
      <span class="toolbar-path" id="toolbar-path">/</span>
      <div class="comment-toggle-wrap">
        <kbd class="shortcut-key">C</kbd>
        <button class="comment-toggle" id="btn-comment" aria-pressed="false" aria-label="Toggle comment mode">
          <span class="toggle-label">Comment</span>
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
        </button>
      </div>
    </div>

    <div class="viewer-frame-wrap" id="frame-wrap">
      <iframe id="prototype-frame" title="Prototype" allowfullscreen></iframe>
      <div class="comment-overlay" id="comment-overlay"></div>
    </div>
  </div>

  <div id="error-banner" class="error-banner hidden"></div>

  <script type="module" src="viewer.js"></script>
</body>
</html>

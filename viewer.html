<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viewer</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="style.css" />
  <script src="env.js"></script>
</head>
<body class="viewer-body">
  <div class="viewer-layout">
    <div class="toolbar" id="toolbar">
      <a href="index.html" class="toolbar-back">← All prototypes</a>
      <span class="toolbar-title" id="toolbar-title">Loading…</span>
      <div class="comment-toggle-wrap">
        <button class="comment-toggle" id="btn-comment" aria-pressed="false" aria-label="Toggle comment mode">
          <span class="toggle-label">Comment</span>
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
        </button>
      </div>
      <div class="toolbar-copy-wrap">
        <button class="toolbar-icon-btn" id="btn-copy-link" aria-label="Copy link">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
          </svg>
        </button>
        <span class="copy-tooltip" id="copy-tooltip">Copied</span>
      </div>
    </div>

    <div class="tracker-warning hidden" id="tracker-warning">Tracker missing — comments won't track internal navigation</div>

    <div class="viewer-frame-wrap" id="frame-wrap">
      <iframe id="prototype-frame" title="Prototype" allowfullscreen></iframe>
      <div class="comment-overlay" id="comment-overlay"></div>
    </div>
  </div>

  <div id="error-banner" class="error-banner hidden"></div>

  <script type="module" src="viewer.js"></script>
</body>
</html>
